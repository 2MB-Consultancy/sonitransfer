<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName sonitransfer.com
    ServerAlias www.sonitransfer.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Files that must keep being served from the old web root:
    # Apple Pay merchant verification, ACME challenges and Google Search Console.
    ProxyPass /.well-known/ !
    Alias /.well-known/ "/var/www/soni-transfer-html/.well-known/"
    ProxyPass /google6beba36225266d63.html !
    Alias /google6beba36225266d63.html "/var/www/soni-transfer-html/google6beba36225266d63.html"
    <Directory "/var/www/soni-transfer-html/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Pages of the previous static site that search engines have indexed.
    RewriteEngine On
    RewriteRule ^/index\.html$ / [R=301,L]
    RewriteRule ^/privacy\.html$ /legal/privacy-policy [R=301,L]
    RewriteRule ^/cookie\.html$ /legal/cookie-policy [R=301,L]
    RewriteRule ^/refund\.html$ /legal/refunds-cancellations [R=301,L]
    RewriteRule ^/complaints\.html$ /legal/complaints-policy [R=301,L]
    RewriteRule ^/(terms-uk|tc-uk)\.html$ /legal/terms-conditions [R=301,L]
    RewriteRule ^/tc.{1,3}belmoney\.html$ /legal/belmoney-terms [R=301,L]
    RewriteRule ^/blog-details\.html$ /community [R=301,L]

    ProxyPass / http://127.0.0.1:3003/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3003/

    ErrorLog ${APACHE_LOG_DIR}/sonitransfer.com-error.log
    CustomLog ${APACHE_LOG_DIR}/sonitransfer.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/sonitransfer.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sonitransfer.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
