<VirtualHost *:80>
    ServerName sonitransfer.com
    ServerAlias www.sonitransfer.com

    ErrorLog ${APACHE_LOG_DIR}/sonitransfer.com-error.log
    CustomLog ${APACHE_LOG_DIR}/sonitransfer.com-access.log combined

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    # Certificate renewal and domain verification files stay on disk.
    Alias /.well-known/ "/var/www/soni-transfer-html/.well-known/"
    <Directory "/var/www/soni-transfer-html/.well-known/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
